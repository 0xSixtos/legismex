name: Legismex CI - Code Quality & Testing 🇲🇽

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'

    - name: Check syntax and undefined names
      run: ruff check src/ tests/unit/ --select E9,F63,F7,F82

    - name: Run unit tests without network access
      run: pytest

    - name: Run Smoke Test (Import Check)
      run: |
        # Validamos que el CLI y los importes base de Legismex funcionen correctamente.
        # Evitamos hacer requests HTTP reales a servidores gubernamentales en CI ya que son inestables y causan 'Failure'.
        python -c "import legismex; print('Legismex imported successfully!')"
